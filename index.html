        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
<video id="myVideo" autoplay loop playsinline muted>
  <source src="your-video.mp4" type="video/mp4">
</video>

<button id="soundToggle">Unmute Video</button>

<script>
  const video = document.getElementById("myVideo");
  const btn = document.getElementById("soundToggle");

  btn.addEventListener("click", function() {
    if (video.muted) {
      video.muted = false;
      btn.textContent = "Mute Video";
    } else {
      video.muted = true;
      btn.textContent = "Unmute Video";
    }
  });
</script>
